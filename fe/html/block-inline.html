<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 블록요소 vs 인라인요소 -->
    
    <!-- p태그  span태그-->
    
    <p>첫번째 블록 요소</p>
    <p>두번째 블록 요소</p>
    <span>첫번째 인라인 요소</span>
    <span>두번째 인라인 요소</span>
    <p>세번째 블록 요소</p>
    <!-- 블록요소는 한 줄을 차지하고, 인라인요소는 한 줄에 여러개가 들어갈 수 있음 -->
    <!-- 그냥 글자를 써도 화면엔 나오지만 이러한 태그들을 사용하는 이유는 그룹을 나누기,대상식별을 위해 사용-->
</body>
</html>
