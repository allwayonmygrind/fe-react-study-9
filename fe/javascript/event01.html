<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #box {
            width: 100px;
            height: 100px;
            background-color: forestgreen;
        }

        .box-bgcolor{
            background-color : darkmagenta;
        }

        .font-white {
            color : white;
        }
    </style>
</head>

<body>

    <h1 id='target'>이벤트 등록</h1>

    <button onclick="event1()">이벤트 버튼1</button>
    <button class="evt-btn" id="btn-evt2">이벤트 버튼1</button>
    <button class="evt-btn" id="btn-evt3">이벤트 버튼1</button>

    <div id="box"> 박스 div </div>

    <script>
        //js 기준 선택자
        document.getElementById('target');  //id 선택자
        document.getElementsByClassName('evt-btn'); // calss 선택자
        document.querySelector('#box');  // css 선택자 문법으로 요소를 선택
        document.querySelectorAll('.evt-btn'); // 

        // 함수를 직접 속성에 연결
        function event1() {
            console.log('event1() 호출됨');
            // document.getElementById('target').textContent = '이벤트 등록1 에서 변경함';
            // document.getElementById('target').style.color = 'red';

            const h1_target = document.getElementById('target');
            h1_target.textContent = '이벤트 등록1 에서 변경함';
            h1_target.style.color = 'red';
        }
        // js에서 함수를 대입
        function event2() {
            console.log('event2() 호출됨');
            const h1_target = document.querySelector('#target')
            h1_target.textContent = '이벤트 등록2 from event2()';
            h1_target.style.fontSize = '36px';
        }
        
        document.getElementById('btn-evt2').onclick = event2;
        // addEventListener
        const btn_evt3 = document.getElementById('btn-evt3');

        const event3 = ()=>{
            console.log('event3()함수 호출됨');
        }

        btn_evt3.addEventListener('click', event3);

        btn_evt3.addEventListener('dblclick',()=>{
            location.href = 'https://www.naver.com'               //js 코드로 페이지 이동 발생
    })

        document.getElementById('box').addEventListener('click', ()=>{
            console.log('박스가 클릭됨')

            // document.getElementById('box').classList.add : 클래스 추가
            // document.getElementById('box').classList.remove : 클래스 삭제
            // document.getElementById('box').classList.toggle : 클래스 on / off (추가/삭제)
            document.getElementById('box').classList.toggle('font-white');
        });

    </script>
</body>

</html>
