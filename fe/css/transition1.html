<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .box{
            width: 100px;
            height: 100px;
            background-color: purple;
            margin: 20px;
            /* 기존에 보유한 속성값 --> 변경될 속성값 */
            /* 전환 효과 transition */
            /* transition-property: width background-color; */
            transition-property: all;
            /* 어떤 속성값을 전환효과로 할꺼냐 */
            transition-duration: 2s;
            /* 몇초에 걸쳐서 할꺼냐 */
            /* 
                transition 속성 위치
                기존  : 마우스 올릴 떄 작동 내릴 떄 작동
                hover : 마우스 올릴 때 작동 내릴 때 작동X
            */
        }
        .box:hover{
            width: 300px;
            background-color: aquamarine;
        }
        .container:hover .box {
            width: 300px;
            background-color: aquamarine;
        }
    </style>
</head>
<body>
    <div class="box"></div>

    <div class="container">
        <div class="box" style="transition-timing-function: linear;"></div>
        <div class="box" style="transition-timing-function: ease;"></div>
        <div class="box" style="transition-timing-function: cubic-bezier(0.79, 0.26, 1, 0.24);"></div>
        <div class="box" style="transition-timing-function: ease-in;"></div>
        <div class="box" style="transition-timing-function: ease-out;"></div>
        <div class="box" style="transition-timing-function: ease-in-out;"></div>
    </div>
</body>
</html>
