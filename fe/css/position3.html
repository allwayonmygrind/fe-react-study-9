<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            width: 200px;
            height: 200px;
        }

        .red-box {
            background-color: red;
            position: relative;
            LEFT: 100PX;
            z-index: 2;
        }   

        .green-box {
            background-color: green;
            position: absolute;
            left: 100px;
            top: 50px;
            z-index: 1;
        }

        .blue-box {
            background-color: blue;
            position: relative;
            left: 50px;
            top: -30px;
        }
        .soobin-container{
            background-color: lightgray;
            position: relative;
        }
    </style>
</head>

<body>
    <div class="box red-box"></div>
    <div class="box green-box"></div>
    <div class="box blue-box"></div>
    <br><br>
    <div class="soobin-container">
        <div class="box red-box"></div>
        <div class="box green-box"></div>
        <div class="box blue-box"></div>
    </div>
</body>

</html>
