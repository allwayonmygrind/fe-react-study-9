<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing: border-box;
        }

        .box1{
            border: 2px solid blue;
            padding: 15px;
            margin: 30px;
        }
        .box2{
            margin:50px;
            margin-top: 100px;
            padding-left: 30px;
            
            /* border:3px dashed red; 이 한줄이 아래랑 똑같음 */
            border-width: 2px;
            border-style: dashed;
            border-color: red;

            width: 200px;
            height: 150px; 
            
            
            /* box-sizing: ; border-box; */
            /* box-sizing: ; content-box; */
        }
    </style>
</head>
<body>
    <div class="box1">
        box1
    </div>
    <div class="box2">
        box2
    </div>

    <p>다른 요소 p태그</p>
</body>
</html>
