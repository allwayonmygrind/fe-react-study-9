<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            /* 전체선택자 -> 모든 요소에 기본 세팅 적용 */
            margin: 0;  /* 외부 여백 */
            padding: 0;  /* 내부 여백 */
            box-sizing: border-box;
            /* 박스모델 사이즈 지정시, border까지 사이즈로 인식*/
        }

        /* 
            display 속성            
                    none            :   표시하지 않겠다 / 숨기겠다 / 안보이게 하겠다
                    block           :   한줄을 다 차지,사이즈(width,height) 적용 가능 ,기본적으로 같이 배치 x, 여백 적용 가능
                    inline          :   컨텐츠 크기만큼만 차지, 사이즈 적용x, 같은줄 옆에 나란히 배치 , 여백 적용(좌,우만)
                    inline-block    :   자체적으로는 block처럼 작동 (사이즈, 여백)
                                        외부적으로는 inline처럼 작동 (다른요소가 옆에 같은줄에 배치 가능)
        */

        .box{
            width: 200px;
            height: 100px;
            border: 1px solid black;

            margin: 10px;
            padding: 10px;
        }
        
        .box1{
            /* div태그 기본 성격 block*/
            width: 200px;
            height: 100px;
            border: 1px solid black;

            margin: 10px;
            padding: 10px;
            display: none;
        }
        .box2{
            /* div태그 기본 성격 block*/
            width: 200px;
            height: 100px;
            border: 1px solid black;

            margin: 10px;
            padding: 10px;
            display: block;
        }
        .box3{
            /* div태그 기본 성격 block*/
            width: 200px;
            height: 100px;
            border: 1px solid black;

            margin: 10px;
            padding: 10px;
            /* display: inline; */
            display:inline-block;
        }
        .span1 {
            display:block;
            /* span같은 기본이 인라인인 요소들은 width같은 명령어가 먹히지 않기에
            display:block같은 명령어로 블럭요소로 만들어 먹히게 만들 수 있음 */

            width:200px;
            height: 100px;
            border: 1px solid blue;
        }
        .parent{
            width:200px;
            height: 100px;
            border: 1px solid blue;
        }
        .child{
            width: 100;
            height: 50px;
            border: 1px solid red;
            display:none;
        }
        .parent:hover .child{
            display:block;
        }
        .parent:hover .parent-span{
            color: blue;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="box box1">box1</div>
    <div class="box box2">box2</div>
    <div class="box box3">box3</div>

    <span class="span1">span1</span>
    <!-- lorem 아무 문장 자동작성 -->
    <span>Lorem ipsum dolor, sit amet consectetur adipisicing elit. Id, sit at delectus est expedita natus reiciendis, ipsa architecto tenetur sunt totam exercitationem. Soluta, perspiciatis officia. Sint veniam fugit consequuntur quidem.</span>


    <div class="parent">
        <span class="parent-span">부모</span>
        <br><br>
        <div class="child">
            자식
        </div>

    </div>
</body>
</html>
