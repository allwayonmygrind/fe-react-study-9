<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            height: 4000px;
        }
        .box {
            width: 200px;
            height: 200px;
        }
        .red-box {
            background-color: red;
            position: relative;
            LEFT: 100PX;
            z-index: 2;
        }
        .green-box {
            background-color: green;
            position: fixed;
            left: 100px;
            top: 50px;
            z-index: 1;
        }
        .blue-box {
            background-color: blue;
            position: relative;
            left: 50px;
            top: -30px;
        }
        .top-box{
            width: 50px;
            height: 50px;
            background-color: orange;
            position: fixed;
            /* 고정되고 화면을 따라옴 */
            right: 50px;
            bottom: 100px;
        }
        .navbar{
            height: 100px;
            background-color: lightblue;
            position: sticky;
            /* top200px 위치에 오는 순간 fixed처럼 됨 */
            top: 200px;
        }
    </style>
</head>
<body>
    <div class="box red-box"></div>
    <div class="box green-box"></div>
    <div class="box blue-box"></div>
    <div class="top-box"></div>
    <div class="navbar"></div>
</body>
</html>
