<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .mainx{
            width: 500px;
            margin: 0 auto;
            margin-top: 50px;
        }
        .doublex{
            width: 500px;
            height: 100px;
        }
        .minibox{
            width: 250px;
            height: 100px;
            display: inline-block;
        }
        .redc {
            background-color: red;

        }
        .greenc{
            background-color: green;
        }
        .textx{
            text-align: center;
        }
        .bluex{
            width: 500px;
            height: 200px;
            background-color: blue;
        }
    </style>
</head>

<body>
    <div class="mainx">
        <div class="doublex">
            <div class="minibox redc">
            </div><div class="minibox greenc"></div>
        </div>
        <div class="textx">
            <div>글자가운데정렬</div>
        </div>
        <div class="bluex"></div>
    </div>
</body>

</html>
