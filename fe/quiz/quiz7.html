<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table,
        th,
        td {
            border: 1px solid black;
            border-collapse: collapse;
        }
        th{color: blue;}
        .main{color:red;}
        table tr:nth-child(2){color:red;}
        .crrd{color:red}
        tr:nth-child(6){color:red;}
        /* css는 상속이 되는 것이 있고 안돼는 것이 있다. color는 됨 */
    </style>
</head>

<body>
    <table>
        <tr>
            <th>순번</th>
            <th>아이디</th>
            <th>이름</th>
        </tr>
        <tr class="main">
            <td>1</td>
            <td>apple12</td>
            <td>유재석</td>
        </tr>
        <tr>
            <td>2</td>
            <td>orange5</td>
            <td>강호동</td>
        </tr>
        <tr class="crrd">
            <td>3</td>
            <td>freshwater</td>
            <td>신동엽</td>
        </tr>
        <tr>
            <td>4</td>
            <td>takcard</td>
            <td>탁재훈</td>
        </tr>
        <tr>
            <td>5</td>
            <td>lognyeon</td>
            <td>장도연</td>
        </tr>
    </table>
</body>

</html>
