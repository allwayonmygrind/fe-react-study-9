<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .sh{
            background-color: lightgray;
        }
        .mainx{
            height: 300px;
            width: 500px;
            border: 4px solid black;
            margin: 40px;
            
        }
        .box{
            height: 100px;
            width: 100px;
        }
        .redx{
            background-color: red;
            position: relative;
        }
        .greenx{
            background-color: green;
            position: absolute;
            left: 100px;
            top: 150px;
        }
        .yellowx{
            background-color: yellow;
            
        }
    </style>
</head>
<body>
    <h3 class="sh">배경색이 lightgray
        <br>h3글자
    </h3>
    <div class="mainx">
        <div class="box redx">a</div>
        <div class="box greenx">b</div>
        <div class="box yellowx">c</div>
    </div>
    <span>아래에 새롭게 나오는 요소</span>
</body>
</html>
